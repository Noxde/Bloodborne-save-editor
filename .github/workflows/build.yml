name: "publish"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Publish Release Assets (Windows & macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Bloodborne save editor ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-linux:
    needs: publish-tauri
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file \
            wget \
            curl \
            xvfb \
            xz-utils \
            jq

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri binary (no bundle)
        env:
          CI: false
        run: npx tauri build --no-bundle

      - name: Locate built binary
        id: locate
        shell: bash
        run: |
          set -e
          BIN=$(find src-tauri/target/release \
            -maxdepth 1 \
            -type f \
            -executable \
            ! -name "*.so" \
            ! -name "*.d" \
            ! -name "build-*" \
            | head -1)

          if [ -z "$BIN" ]; then
            echo "::error::Could not locate binary"
            ls -la src-tauri/target/release
            exit 1
          fi

          echo "binary=$(realpath "$BIN")" >> "$GITHUB_OUTPUT"

      - name: Install quick-sharun
        run: |
          wget -q https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/quick-sharun.sh
          chmod +x quick-sharun.sh

      - name: Fix binary name and prepare AppDir
        id: fix_bin
        run: |
          ORIGINAL_BIN="${{ steps.locate.outputs.binary }}"
          DIR_NAME=$(dirname "$ORIGINAL_BIN")
          CLEAN_BIN="${DIR_NAME}/bloodborne-save-editor"

          cp "$ORIGINAL_BIN" "$CLEAN_BIN"
          echo "clean_binary=${CLEAN_BIN}" >> "$GITHUB_OUTPUT"

          mkdir -p AppDir
          cat <<EOF > AppDir/bloodborne-save-editor.desktop
          [Desktop Entry]
          Type=Application
          Name=Bloodborne Save Editor
          Exec=bloodborne-save-editor
          Icon=bloodborne-save-editor
          Categories=Utility;
          EOF

          cp "src-tauri/icons/icon.png" AppDir/bloodborne-save-editor.png

      - name: Build portable AppImage
        env:
          VERSION: ${{ github.ref_name }}
          STRACE_MODE: 0
          DEPLOY_GTK: 1
          DEPLOY_OPENGL: 1
          DEPLOY_VULKAN: 1
          DEPLOY_GSTREAMER: 1
          DEPLOY_PIPEWIRE: 1
          DEPLOY_PULSE: 1
          OUTPUT_APPIMAGE: 1
          APPIMAGE_NAME: Bloodborne-save-editor
        run: |
          xvfb-run --auto-servernum ./quick-sharun.sh "${{ steps.fix_bin.outputs.clean_binary }}"

      - name: Rename AppImage
        run: |
          mv Bloodborne*.AppImage \
             Bloodborne-Save-Editor_${{ github.ref_name }}_amd64.AppImage

      - name: Sign AppImage for updater
        id: sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          FILE="Bloodborne-Save-Editor_${{ github.ref_name }}_amd64.AppImage"
          npx tauri signer sign "$FILE"
          echo "signature=$(cat "${FILE}.sig")" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bloodborne-save-editor-AppImage
          path: |
            Bloodborne-Save-Editor_${{ github.ref_name }}_amd64.AppImage
            Bloodborne-Save-Editor_${{ github.ref_name }}_amd64.AppImage.sig

      - name: Attach AppImage to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            Bloodborne-Save-Editor_${{ github.ref_name }}_amd64.AppImage
            Bloodborne-Save-Editor_${{ github.ref_name }}_amd64.AppImage.sig

      - name: Merge Linux entry into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          URL="https://github.com/${REPO}/releases/download/${TAG}/Bloodborne-Save-Editor_${TAG}_amd64.AppImage"

          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output latest.json --clobber

          jq --arg sig "${{ steps.sign.outputs.signature }}" \
             --arg url "$URL" \
             '.platforms["linux-x86_64"] = {"signature": $sig, "url": $url}' \
             latest.json > latest.json.tmp
          mv latest.json.tmp latest.json

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
